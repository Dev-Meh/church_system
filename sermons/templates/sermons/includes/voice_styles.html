<style>
/* Voice recorder (WhatsApp-style) */
.voice-recorder {
  background: rgba(15,30,46,0.9);
  border: 1px solid rgba(37,211,102,0.25);
  border-radius: 14px;
  padding: 1rem;
  margin: 1rem 0;
}
.voice-recorder-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: #25d366;
  margin-bottom: 0.75rem;
}
.voice-recorder-bar {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}
.voice-mic-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #25d366, #128c7e);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: transform 0.15s, box-shadow 0.15s;
}
.voice-mic-btn:hover { transform: scale(1.04); }
.voice-mic-btn.recording {
  animation: pulse-mic 1s infinite;
  box-shadow: 0 0 0 8px rgba(37,211,102,0.2);
}
@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 0 0 4px rgba(231,76,60,0.25); }
  50% { box-shadow: 0 0 0 10px rgba(231,76,60,0.08); }
}
.voice-mic-btn.recording { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.voice-recorder-info { flex: 1; min-width: 0; }
.voice-recorder-status { font-size: 13px; color: rgba(255,255,255,0.85); }
.voice-recorder-timer { font-size: 18px; font-weight: 700; color: #25d366; font-variant-numeric: tabular-nums; }
.voice-clear-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(231,76,60,0.4);
  background: rgba(231,76,60,0.12);
  color: #e74c3c;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.voice-preview { width: 100%; margin-top: 0.75rem; }
.voice-recorder-hint { font-size: 11px; color: rgba(255,255,255,0.45); margin: 0.65rem 0 0; line-height: 1.45; }
.hidden { display: none !important; }
.file-upload-fallback { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(255,255,255,0.06); }
.file-upload-fallback label { font-size: 11px; color: rgba(255,255,255,0.45); }

/* WhatsApp-style voice player */
.wa-voice-player {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  background: rgba(37,211,102,0.12);
  border: 1px solid rgba(37,211,102,0.22);
  border-radius: 999px;
  padding: 0.55rem 0.85rem 0.55rem 0.55rem;
  max-width: 420px;
}
.wa-voice-play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #25d366;
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.wa-voice-track { flex: 1; min-width: 0; }
.wa-voice-bars {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
  cursor: pointer;
}
.wa-voice-bars span {
  width: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.35);
  height: 30%;
  transition: height 0.15s;
}
.wa-voice-player.playing .wa-voice-bars span { animation: wa-bar 0.8s ease-in-out infinite; }
.wa-voice-bars span:nth-child(odd) { animation-delay: 0.1s; }
.wa-voice-bars span:nth-child(3n) { animation-delay: 0.2s; }
@keyframes wa-bar {
  0%, 100% { height: 30%; }
  50% { height: 90%; background: #25d366; }
}
.wa-voice-seek {
  width: 100%;
  margin-top: 2px;
  accent-color: #25d366;
  height: 4px;
}
.wa-voice-time {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}
.wa-voice-audio { display: none; }

/* Inline video player */
.inline-video-player { width: 100%; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.08); }

.video-panel { border-color: rgba(200,168,75,0.22); }

.sermon-inline-video { margin-bottom: 0.65rem; border-radius: 14px; overflow: hidden; background: #000; }
.sermon-inline-video .inline-video { max-height: 240px; }
</style>
