{% load static %}
<style>
.chart-panel .panel-bd { padding: 1rem 1.25rem 1.25rem; }
.chart-wrap {
  position: relative;
  height: 300px;
  min-height: 220px;
  padding: 0.5rem 0.25rem 0;
  background: linear-gradient(165deg, rgba(15, 30, 46, 0.55) 0%, rgba(21, 35, 51, 0.2) 100%);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.chart-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
.chart-empty-note {
  margin: 0;
  padding: 2.5rem 1rem;
  text-align: center;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.45);
}
@media (max-width: 576px) {
  .chart-wrap { height: 240px; min-height: 200px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
