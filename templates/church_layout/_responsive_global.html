<style>
/* ── Global responsive (all pages) ── */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body.nav-open {
  overflow: hidden;
}

.cm-mobile-menu-fab {
  display: none;
  position: fixed;
  bottom: 1.25rem;
  right: 1.25rem;
  z-index: 250;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid rgba(200, 168, 75, 0.55);
  background: var(--cm-fab-bg);
  color: var(--cm-gold);
  box-shadow: 0 8px 24px var(--cm-shadow);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.cm-mobile-menu-fab svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.5;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 180;
  backdrop-filter: blur(2px);
}
.sidebar-backdrop.visible {
  display: block;
}

/* Grids & forms used across the app */
.donation-grid,
.info-cards,
.pd-panels,
.pd-grid,
.stats-grid,
.form-row,
.sheet-row,
.chart-row {
  min-width: 0;
}

.chart-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.25rem;
}
.chart-panel {
  background: var(--cm-surface);
  border: 1px solid var(--cm-border);
  border-radius: 12px;
  overflow: hidden;
}
.chart-panel .panel-hd {
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--cm-border-subtle);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: var(--cm-gold);
}

@media (max-width: 992px) {
  .cm-mobile-menu-fab {
    display: inline-flex;
  }
  body:has(.topnav-menu-btn) .cm-mobile-menu-fab {
    display: none !important;
  }

  /* Legacy + app shell: slide-in sidebar drawer */
  .layout > .sidebar,
  .layout > aside.sidebar,
  #sidebar.sidebar,
  aside#sidebar.sidebar {
    position: fixed !important;
    left: 0;
    top: 0;

    min-width: 0 !important;
    max-width: 92vw;
    height: 100vh !important;
    min-height: 0 !important;
    margin: 0 !important;
    transform: translateX(-105%);

    z-index: 200;
    border-right: 2px solid rgba(200, 168, 75, 0.45) !important;
    border-bottom: none !important;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

  .layout > aside.sidebar.mobile-open,

    bottom: 0;
    z-index: 5;
    flex-shrink: 0;
    margin-top: auto;

    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.4);

    font-size: 13px;

    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .topnav-title,
  .topbar h2 {
    font-size: 1.1rem !important;
    line-height: 1.25;
  }

    min-width: 0;
    flex: 1 1 auto;
  }
  .topnav-profile-link {
    display: flex;
    margin-left: auto;
    flex-shrink: 0;
  }

    flex-wrap: wrap;
    gap: 0.5rem;
    width: 100%;

    margin-left: 0;

    text-align: center;
    max-width: 100%;
  }

  .page-body {
    padding: 1rem !important;
    max-width: none !important;
  }

  .donation-grid,
  .info-cards,
  .pd-panels {
    grid-template-columns: 1fr !important;
  }
  .pd-layout {
    flex-direction: column !important;
  }
  .pd-sidebar {
    width: 100% !important;
    min-width: 100% !important;
    margin-right: 0 !important;
    margin-bottom: 1rem;
  }

  .wrap {
    margin: 12px auto !important;
    padding: 0 12px !important;
  }

  /* Cards: simu — zibaki kwenye mpangilio (side by side) ndogo, si kufuatana chini */

  .stats-grid,
  .stat-grid,
  .info-cards {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 0.75rem !important;
  }
  .pd-card,
  .stat-card,
  .stat-box {
    padding: 0.85rem !important;
  }
  .pd-value {
    font-size: 1.35rem !important;
  }
  .pd-label {
    font-size: 0.72rem !important;
  }
}

    right: max(1rem, env(safe-area-inset-right));
  }
}

/* Tables: horizontal scroll on small screens */
.page-body .table,
.page-body table,
.panel .table,
.panel-bd table,
.panel-body table,
.tbl-wrap,
.table-responsive {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.page-body table,
.panel table {
  min-width: 520px;
}
.sheet-table {
  display: block;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* Touch-friendly controls */
@media (max-width: 992px) {
  .nav-item,
  .btn-logout,
  .action-btn,
  .btn-donate,
  .btn-primary-sm {
    min-height: 44px;
  }
  .btn,
  button,
  a.btn {

  }
}

/* Print pages: keep readable width */
@media print {
  .cm-mobile-menu-fab,
  .sidebar-backdrop {
    display: none !important;
  }
}
</style>
