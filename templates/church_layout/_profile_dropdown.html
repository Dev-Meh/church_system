{% load i18n_church member_extras %}
<div class="topnav-profile-menu" id="topnavProfileMenu">
  <button
    type="button"
    class="topnav-profile-trigger"
    id="topnavProfileTrigger"
    aria-expanded="false"
    aria-haspopup="true"
    aria-controls="topnavProfileDropdown"
  >
    {% user_avatar user 38 %}
    <span class="topnav-profile-trigger-text">
      <span class="topnav-profile-trigger-name">{{ user.first_name }}</span>
      <span class="topnav-profile-trigger-role">
        {% if user.role == 'pastor' %}{% church_t 'pastor' %}{% elif user.is_app_admin %}Admin{% elif user.role == 'secretary' %}Katibu{% elif user.role == 'accountant' %}Mhasibu{% else %}{% church_t 'church_member' %}{% endif %}
      </span>
    </span>
    <svg class="topnav-profile-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div class="topnav-profile-dropdown" id="topnavProfileDropdown" hidden>
    <div class="topnav-profile-dropdown-hd">
      <div class="topnav-profile-dropdown-name">{{ user.first_name }} {{ user.last_name }}</div>
      <div class="topnav-profile-dropdown-email">{{ user.email|default:user.username }}</div>
    </div>
    <a href="{% url 'profile_edit' %}" class="topnav-profile-dropdown-item">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span>{% church_t 'edit_profile' %}</span>
    </a>
    <a href="{% url 'profile' %}" class="topnav-profile-dropdown-item">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>{% church_t 'my_profile' %}</span>
    </a>
    <div class="topnav-profile-dropdown-divider"></div>
    <form method="post" action="{% url 'members:logout' %}" class="topnav-profile-logout-form">
      {% csrf_token %}
      <button type="submit" class="topnav-profile-dropdown-item topnav-profile-dropdown-item--danger">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>{% church_t 'sign_out' %}</span>
      </button>
    </form>
  </div>
</div>
