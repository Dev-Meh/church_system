<style>
.language-pill-container {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 1px;
    border-radius: 999px;
    position: relative;
    user-select: none;
    min-width: 0;
    flex-shrink: 0;
}

.language-pill-option {
    position: relative;
    z-index: 2;
    padding: 2px 6px;
    cursor: pointer;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.2;
    color: rgba(255, 255, 255, 0.65);
    text-decoration: none;
    transition: color 0.2s ease;
    letter-spacing: 0.2px;
}

.language-pill-option:hover {
    color: #fff;
}

.language-pill-option.active {
    color: #c8a84b;
}

.language-pill-slider {
    position: absolute;
    top: 1px;
    left: 1px;
    height: calc(100% - 2px);
    width: calc(50% - 1px);
    background: rgba(200, 168, 75, 0.18);
    border: 1px solid rgba(200, 168, 75, 0.28);
    border-radius: 999px;
    z-index: 1;
    transition: transform 0.25s ease;
}

{% with current_lang=current_language|default:'en' %}
    {% if current_lang == 'sw' %}
    .language-pill-slider {
        transform: translateX(100%);
    }
    {% endif %}
{% endwith %}

.topnav-actions .language-pill-container {
    margin: 0;
}

.auth-lang-compact {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    margin-top: 0.2rem;
}

.auth-lang-compact a {
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    padding: 1px 4px;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.65);
}

.auth-lang-compact a.is-active {
    color: #c8a84b;
}

.auth-lang-compact .auth-lang-sep {
    color: rgba(255, 255, 255, 0.25);
    font-size: 8px;
    line-height: 1;
}
</style>

<div class="language-pill-container" aria-label="Language">
    {% with current_lang=current_language|default:'en' %}
    <a href="{% url 'members:set_language' 'en' %}"
       class="language-pill-option {% if current_lang == 'en' %}active{% endif %}"
       title="English">EN</a>
    <a href="{% url 'members:set_language' 'sw' %}"
       class="language-pill-option {% if current_lang == 'sw' %}active{% endif %}"
       title="Kiswahili">SW</a>
    <div class="language-pill-slider"></div>
    {% endwith %}
</div>

<script>
document.querySelectorAll('.language-pill-option').forEach(function (option) {
    option.addEventListener('click', function () {
        var container = this.closest('.language-pill-container');
        if (!container) return;
        var slider = container.querySelector('.language-pill-slider');
        var options = container.querySelectorAll('.language-pill-option');
        options.forEach(function (opt) { opt.classList.remove('active'); });
        this.classList.add('active');
        if (slider) {
            slider.style.transform = this.textContent.trim() === 'SW'
                ? 'translateX(100%)'
                : 'translateX(0)';
        }
    });
});
</script>
